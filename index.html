<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Blue Ring</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  canvas { display: block; touch-action: none; cursor: grab; }
</style>
</head>
<body>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/CopyShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script>
<script>
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x000000);
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(40, innerWidth / innerHeight, 0.1, 200);

const ELEVATION = 42 * Math.PI / 180;
const ROLL = 0.55;
let zoom = 1, zoomTarget = 1, explodeAmt = 0;
function placeCamera() {
  const aspect = innerWidth / innerHeight;
  const dist = 15.5 * Math.max(1, 1 / aspect) * zoom * (1 + 0.85 * explodeAmt);
  const ty = -3.1 * explodeAmt;
  camera.position.set(0, Math.sin(ELEVATION) * dist + ty, Math.cos(ELEVATION) * dist);
  camera.up.set(Math.sin(ROLL), Math.cos(ROLL), 0);
  camera.lookAt(0, ty, 0);
  camera.aspect = aspect;
  camera.updateProjectionMatrix();
}
placeCamera();

/* Layer 0 = glowing parts (bloom). Layer 1 = solid parts, drawn after, no bloom. */
const amb = new THREE.AmbientLight(0xffffff, 0.85);
amb.layers.enable(1);
scene.add(amb);
const sun = new THREE.DirectionalLight(0xffffff, 0.7);
sun.position.set(4, 10, 6);
sun.layers.enable(1);
scene.add(sun);

const R_IN = 2.0, R_OUT = 3.1, THICK = 0.8;
const shape = new THREE.Shape();
shape.absarc(0, 0, R_OUT, 0, Math.PI * 2, false);
const hole = new THREE.Path();
hole.absarc(0, 0, R_IN, 0, Math.PI * 2, true);
shape.holes.push(hole);

const geo = new THREE.ExtrudeGeometry(shape, { depth: THICK, curveSegments: 160, bevelEnabled: false });
geo.translate(0, 0, -THICK / 2);
geo.rotateX(-Math.PI / 2);

const glowMat = new THREE.ShaderMaterial({
  transparent: true, depthWrite: false, side: THREE.DoubleSide,
  blending: THREE.AdditiveBlending,
  vertexShader: `
    varying vec3 vN, vV;
    void main(){
      vec4 mv = modelViewMatrix * vec4(position, 1.0);
      vN = normalize(normalMatrix * normal);
      vV = normalize(-mv.xyz);
      gl_Position = projectionMatrix * mv;
    }`,
  fragmentShader: `
    varying vec3 vN, vV;
    void main(){
      float f = pow(1.0 - abs(dot(normalize(vN), normalize(vV))), 2.2);
      float a = 0.40 + 0.50 * f;
      vec3 c = vec3(0.02, 0.10, 0.85) * (1.2 + 1.6 * f);
      gl_FragColor = vec4(c * a, a);
    }`
});
const ring = new THREE.Mesh(geo, glowMat);

const edgeMat = new THREE.MeshBasicMaterial({ color: 0x2a46d8 });
[R_IN, R_OUT].forEach(r => [-THICK / 2, THICK / 2].forEach(y => {
  const t = new THREE.Mesh(new THREE.TorusGeometry(r, 0.026, 8, 240), edgeMat);
  t.rotation.x = Math.PI / 2;
  t.position.y = y;
  ring.add(t);
}));

const coreMat = new THREE.ShaderMaterial({
  transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
  uniforms: { uTime: { value: 0 }, uIntensity: { value: 1 } },
  vertexShader: `
    varying vec3 vN, vV, vP;
    void main(){
      vP = position;
      vec4 mv = modelViewMatrix * vec4(position, 1.0);
      vN = normalize(normalMatrix * normal);
      vV = normalize(-mv.xyz);
      gl_Position = projectionMatrix * mv;
    }`,
  fragmentShader: `
    varying vec3 vN, vV, vP;
    uniform float uTime, uIntensity;
    void main(){
      float c = pow(abs(dot(normalize(vN), normalize(vV))), 1.6);
      float ang = atan(vP.z, vP.x);                              // position around the ring
      float phi = atan(vP.y, length(vP.xz) - 2.55);              // position around the tube
      float s1 = 0.5 + 0.5 * sin(ang * 7.0 + phi * 2.0 - uTime * 2.4);
      float s2 = 0.5 + 0.5 * sin(ang * 13.0 - phi * 3.0 - uTime * 3.6);
      float s3 = 0.5 + 0.5 * sin(ang * 3.0 - uTime * 1.6);
      float flow = 0.35 + 0.65 * (0.5 * s1 * s1 + 0.3 * s2 * s2 * s2 + 0.2 * s3);
      float a = 0.8 * c * uIntensity * flow;
      vec3 col = mix(vec3(0.02, 0.10, 0.80), vec3(0.18, 0.32, 1.0), pow(s1 * s2, 2.0));
      gl_FragColor = vec4(col * a * 2.0, a);
    }`
});
const coreGeo = new THREE.TorusGeometry((R_IN + R_OUT) / 2, 0.3, 24, 240);
coreGeo.rotateX(Math.PI / 2);
ring.add(new THREE.Mesh(coreGeo, coreMat));

/* 16 wrap lines = 8 pairs, each one full turn around the ring's cross-section */
const PAIRS = 8;
const PAIR_HALF_GAP = 0.135;
const RIB_WIDTH = 0.10; const RIB_HEIGHT = 0.07;
const wrapMat = new THREE.MeshPhongMaterial({ color: 0x000000, specular: 0x1a1a1a, shininess: 40, side: THREE.DoubleSide });

function crossSection() {
  const w = (R_OUT - R_IN) / 2;
  const h = THICK / 2;
  const rc = 0.1;
  const rMid = (R_IN + R_OUT) / 2;
  const pts = [];
  const corners = [
    [ w - rc,  h - rc, 0],
    [-(w - rc), h - rc, Math.PI / 2],
    [-(w - rc), -(h - rc), Math.PI],
    [ w - rc, -(h - rc), Math.PI * 1.5]
  ];
  corners.forEach(([cx, cy, a0]) => {
    for (let i = 0; i <= 8; i++) {
      const a = a0 + (i / 8) * Math.PI / 2;
      pts.push([rMid + cx + rc * Math.cos(a), cy + rc * Math.sin(a), Math.cos(a), Math.sin(a)]);
    }
  });
  return pts;
}
const section = crossSection();

function makeWrap(phi) {
  const c = Math.cos(phi), s = Math.sin(phi);
  const tx = -s, tz = c;
  const hw = RIB_WIDTH / 2;
  const prof = [[-hw, 0], [-hw, RIB_HEIGHT], [hw, RIB_HEIGHT], [hw, 0]];
  const N = section.length;
  const pos = [], idx = [];
  for (let side = 0; side < 3; side++) {
    const base = pos.length / 3;
    for (let i = 0; i < N; i++) {
      const [r, y, nr, ny] = section[i];
      [prof[side], prof[side + 1]].forEach(([u, v]) => {
        const rr = r + nr * v, yy = y + ny * v;
        pos.push(rr * c + tx * u, yy, rr * s + tz * u);
      });
    }
    for (let i = 0; i < N; i++) {
      const a = base + i * 2, b = base + ((i + 1) % N) * 2;
      idx.push(a, a + 1, b, b, a + 1, b + 1);
    }
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setIndex(idx);
  g.computeVertexNormals();
  const rib = new THREE.Mesh(g, wrapMat);
  rib.layers.set(1);
  return rib;
}

const group1 = new THREE.Group();
group1.name = 'Group 1';
const windings = new THREE.Group();
windings.name = 'Windings';
ring.add(windings);
windings.add(group1);
const WIRE_R = 0.02;
const WIRES_PER_GAP = 22;
const WIRE_SPAN = PAIR_HALF_GAP - 0.036;
function makeStudioEnv() {
  const faces = [];
  for (let f = 0; f < 6; f++) {
    const c = document.createElement('canvas');
    c.width = c.height = 128;
    const g = c.getContext('2d');
    const grad = g.createLinearGradient(0, 0, 0, 128);
    if (f === 2) { grad.addColorStop(0, '#ffffff'); grad.addColorStop(1, '#d8d8d8'); }
    else if (f === 3) { grad.addColorStop(0, '#1a1a1a'); grad.addColorStop(1, '#0c0c0c'); }
    else {
      grad.addColorStop(0, '#f2f2f2'); grad.addColorStop(0.45, '#9a9a9a');
      grad.addColorStop(0.55, '#3a3a3a'); grad.addColorStop(1, '#161616');
    }
    g.fillStyle = grad; g.fillRect(0, 0, 128, 128);
    if (f !== 2 && f !== 3) {
      g.fillStyle = '#ffffff'; g.fillRect(20 + f * 7, 0, 14, 128); g.fillRect(88 - f * 5, 0, 8, 128);
    }
    faces.push(c);
  }
  const tex = new THREE.CubeTexture(faces);
  tex.needsUpdate = true;
  return tex;
}
const copperMat = new THREE.MeshStandardMaterial({
  color: 0xf0a47c, metalness: 1.0, roughness: 0.28,
  envMap: makeStudioEnv(), envMapIntensity: 1.25
});
const wirePts = section.map(([r, y, nr, ny]) => new THREE.Vector3(r + nr * WIRE_R, y + ny * WIRE_R, 0));
const wireGeo = new THREE.TubeGeometry(new THREE.CatmullRomCurve3(wirePts, true, 'centripetal'), 160, WIRE_R, 8, true);

for (let k = 0; k < PAIRS; k++) {
  const center = (k / PAIRS) * Math.PI * 2;
  group1.add(makeWrap(center - PAIR_HALF_GAP));
  group1.add(makeWrap(center + PAIR_HALF_GAP));
  for (let i = 0; i < WIRES_PER_GAP; i++) {
    const phi = center - WIRE_SPAN + (i / (WIRES_PER_GAP - 1)) * 2 * WIRE_SPAN;
    const wire = new THREE.Mesh(wireGeo, copperMat);
    wire.rotation.y = -phi;
    wire.layers.set(1);
    windings.add(wire);
  }
}

/* Plate inside the ring's hole: slotted top layer, hex screws, tabs, two copper rings */
const PLATE_R_OUT = R_IN;
const PLATE_R_HOLE = 1.1;
const PLATE_LAYER = 0.12;
const SLOT_COUNT = 24, SLOT_LEN = 0.72, SLOT_W = 0.2;
const SCREW_COUNT = 3;
const SLOT_MID_R = (PLATE_R_OUT + PLATE_R_HOLE) / 2;

function plateShape(withSlots) {
  const sh = new THREE.Shape();
  sh.absarc(0, 0, PLATE_R_OUT, 0, Math.PI * 2, false);
  const mid = new THREE.Path();
  mid.absarc(0, 0, PLATE_R_HOLE, 0, Math.PI * 2, true);
  sh.holes.push(mid);
  if (withSlots) {
    for (let k = 0; k < SLOT_COUNT; k++) {
      if (k % (SLOT_COUNT / SCREW_COUNT) === 0) continue;
      const a = (k / SLOT_COUNT) * Math.PI * 2;
      const ca = Math.cos(a), sa = Math.sin(a);
      const half = SLOT_LEN / 2 - SLOT_W / 2;
      const pts = [];
      for (let i = 0; i <= 12; i++) {
        const t = -Math.PI / 2 + (i / 12) * Math.PI;
        pts.push([half + (SLOT_W / 2) * Math.cos(t), (SLOT_W / 2) * Math.sin(t)]);
      }
      for (let i = 0; i <= 12; i++) {
        const t = Math.PI / 2 + (i / 12) * Math.PI;
        pts.push([-half + (SLOT_W / 2) * Math.cos(t), (SLOT_W / 2) * Math.sin(t)]);
      }
      const world = pts.map(([lx, ly]) => {
        const x = SLOT_MID_R + lx;
        return new THREE.Vector2(x * ca - ly * sa, x * sa + ly * ca);
      });
      sh.holes.push(new THREE.Path(world));
    }
  }
  return sh;
}

const plateMat = new THREE.MeshPhongMaterial({ color: 0x59626f, specular: 0xaab4c4, shininess: 70, side: THREE.DoubleSide });
const plateOpts = { depth: PLATE_LAYER, curveSegments: 128, bevelEnabled: false };

const baseGeo = new THREE.ExtrudeGeometry(plateShape(true), plateOpts);
baseGeo.translate(0, 0, -PLATE_LAYER);
baseGeo.rotateX(-Math.PI / 2);
const topGeo = new THREE.ExtrudeGeometry(plateShape(true), plateOpts);
topGeo.rotateX(-Math.PI / 2);

const plate = new THREE.Group();
plate.name = 'Plate';
[baseGeo, topGeo].forEach(g => {
  const m = new THREE.Mesh(g, plateMat);
  m.layers.set(1);
  plate.add(m);
});
const HEX_R = 0.2, HEAD_H = 0.16, CHAMFER = 0.025, WASHER_R = 0.23, WASHER_H = 0.03;
const hexShape = new THREE.Shape();
for (let i = 0; i < 6; i++) {
  const t = i * Math.PI / 3, x = HEX_R * Math.cos(t), y = HEX_R * Math.sin(t);
  if (i === 0) hexShape.moveTo(x, y); else hexShape.lineTo(x, y);
}
hexShape.closePath();
const headGeo = new THREE.ExtrudeGeometry(hexShape, {
  depth: HEAD_H - 2 * CHAMFER, curveSegments: 1, bevelEnabled: true,
  bevelThickness: CHAMFER, bevelSize: CHAMFER, bevelOffset: -CHAMFER, bevelSegments: 2
});
headGeo.translate(0, 0, CHAMFER);
headGeo.rotateX(-Math.PI / 2);
headGeo.translate(0, WASHER_H, 0);
const washerGeo = new THREE.CylinderGeometry(WASHER_R, WASHER_R, WASHER_H, 32);
washerGeo.translate(0, WASHER_H / 2, 0);
const shankBottom = -(2 * PLATE_LAYER + 0.15);
const shankGeo = new THREE.CylinderGeometry(0.07, 0.07, WASHER_H - shankBottom, 16);
shankGeo.translate(0, (WASHER_H + shankBottom) / 2, 0);
const screwMat = new THREE.MeshPhongMaterial({ color: 0x9aa4b2, specular: 0xffffff, shininess: 90 });
const TAB_LEN = 1.25, TAB_W = 0.26, TAB_T = 0.05, TAB_BACK = 0.1;
const tabGeo = new THREE.BoxGeometry(TAB_LEN + TAB_BACK, TAB_T, TAB_W);
tabGeo.translate((TAB_LEN - TAB_BACK) / 2, 0, 0);
for (let j = 0; j < SCREW_COUNT; j++) {
  const a = (j / SCREW_COUNT) * Math.PI * 2;
  const screw = new THREE.Group();
  screw.name = 'Screw ' + (j + 1);
  [headGeo, washerGeo, shankGeo].forEach(g => {
    const m = new THREE.Mesh(g, screwMat);
    m.layers.set(1);
    screw.add(m);
  });
  const tab = new THREE.Mesh(tabGeo, screwMat);
  tab.layers.set(1);
  tab.position.y = -(2 * PLATE_LAYER) - TAB_T / 2;
  tab.rotation.y = a + Math.PI;
  screw.add(tab);
  screw.position.set(SLOT_MID_R * Math.cos(a), PLATE_LAYER, -SLOT_MID_R * Math.sin(a));
  plate.add(screw);
}
const RING_TUBE = 0.03;
[0.95, 0.6].forEach(r => {
  const g = new THREE.TorusGeometry(r, RING_TUBE, 16, 160);
  g.rotateX(Math.PI / 2);
  const m = new THREE.Mesh(g, copperMat);
  m.position.y = -PLATE_LAYER + RING_TUBE;
  m.layers.set(1);
  plate.add(m);
});
ring.add(plate);

/* Discs stacked under the object */
const DISC_T = 0.06;
const DISC_GAP = 2.4;
const DISC_RADII = [PLATE_R_OUT, 1.88];
const DISC_THICK = [DISC_T, 0.12];
const GRID_STEP = 0.18;
const GRID_W = 0.006;
const gridMat = new THREE.MeshBasicMaterial({ color: 0x000000, transparent: true, opacity: 0.8, depthWrite: false, side: THREE.DoubleSide });
function gridGeometry(r) {
  const p = [], idx = [], K = Math.floor(r / GRID_STEP), hw = GRID_W / 2;
  const quad = (x0, z0, x1, z1, nx, nz) => {
    const i = p.length / 3;
    p.push(x0 - nx * hw, 0, z0 - nz * hw, x0 + nx * hw, 0, z0 + nz * hw,
           x1 - nx * hw, 0, z1 - nz * hw, x1 + nx * hw, 0, z1 + nz * hw);
    idx.push(i, i + 1, i + 2, i + 2, i + 1, i + 3);
  };
  for (let k = -K; k <= K; k++) {
    const v = k * GRID_STEP, h = Math.sqrt(Math.max(0, r * r - v * v));
    quad(v, -h, v, h, 1, 0);
    quad(-h, v, h, v, 0, 1);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(p, 3));
  g.setIndex(idx);
  return g;
}
const discBlueMat = new THREE.ShaderMaterial({
  transparent: true, depthWrite: false, side: THREE.DoubleSide,
  blending: THREE.AdditiveBlending,
  vertexShader: `
    varying vec3 vN, vV;
    void main(){
      vec4 mv = modelViewMatrix * vec4(position, 1.0);
      vN = normalize(normalMatrix * normal);
      vV = normalize(-mv.xyz);
      gl_Position = projectionMatrix * mv;
    }`,
  fragmentShader: `
    varying vec3 vN, vV;
    void main(){
      float f = pow(1.0 - abs(dot(normalize(vN), normalize(vV))), 2.0);
      float a = 0.42 + 0.3 * f;
      vec3 c = vec3(0.06, 0.42, 1.0) * (1.0 + 0.8 * f);
      gl_FragColor = vec4(c * a, a);
    }`
});
/* Filler discs: solid glowing blue when assembled */
const fillerGlowMat = discBlueMat.clone();
fillerGlowMat.transparent = false;
fillerGlowMat.depthWrite = true;
fillerGlowMat.blending = THREE.NoBlending;
fillerGlowMat.uniforms = { uTime: { value: 0 }, uY: { value: 0 } };
fillerGlowMat.fragmentShader = `
    varying vec3 vN, vV;
    uniform float uTime, uY;
    void main(){
      float f = pow(1.0 - abs(dot(normalize(vN), normalize(vV))), 2.0);
      float wave = 0.5 + 0.5 * sin(uY * 7.0 - uTime * 4.0);
      vec3 c = vec3(0.08, 0.50, 1.0) * (1.05 + 0.9 * f + 0.6 * wave);
      c += vec3(0.30, 0.65, 0.70) * pow(wave, 6.0) * 0.55;
      gl_FragColor = vec4(c, 1.0);
    }`;
fillerGlowMat.needsUpdate = true;
/* Filler discs in the exploded view: see-through ghosts so the electronics inside are visible */
const fillerGhostMat = new THREE.ShaderMaterial({
  transparent: true, depthWrite: false, side: THREE.DoubleSide, blending: THREE.AdditiveBlending,
  uniforms: { uTime: { value: 0 }, uY: { value: 0 } },
  vertexShader: discBlueMat.vertexShader,
  fragmentShader: `
    varying vec3 vN, vV;
    uniform float uTime, uY;
    void main(){
      float f = pow(1.0 - abs(dot(normalize(vN), normalize(vV))), 2.0);
      float a = 0.04 + 0.14 * f;
      gl_FragColor = vec4(vec3(0.08, 0.5, 1.0) * a * 2.0, a);
    }`
});
const fillerRimMat = new THREE.MeshBasicMaterial({ color: 0x6fd0ff });
const discBaseMat = new THREE.MeshPhongMaterial({ color: 0xffffff, specular: 0x555555, shininess: 40 });
const discBlueRimMat = new THREE.MeshBasicMaterial({ color: 0x2f86ff });
const discRimMat = new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.7, depthWrite: false });
const discs = new THREE.Group();
discs.name = 'Translucent Discs';
let discTop = -PLATE_LAYER;
DISC_RADII.forEach(r => {
  const isTop = discs.children.length === 0;
  const d = new THREE.Mesh(new THREE.CylinderGeometry(r, r, DISC_THICK[discs.children.filter(o => o.geometry.type === 'CylinderGeometry').length], 128), isTop ? discBlueMat : discBaseMat);
  const thick = d.geometry.parameters.height;
  d.position.y = discTop - thick / 2;
  d.layers.set(isTop ? 0 : 1);
  discs.add(d);
  const rim = new THREE.Mesh(new THREE.TorusGeometry(r, isTop ? 0.016 : 0.012, 8, 200), isTop ? discBlueRimMat : discRimMat);
  rim.rotation.x = Math.PI / 2;
  rim.position.y = discTop;
  rim.layers.set(isTop ? 0 : 1);
  discs.add(rim);
  if (isTop) {
    const grid = new THREE.Mesh(gridGeometry(r), gridMat);
    grid.position.y = discTop - thick - 0.003;
    grid.rotation.y = Math.PI / 4;
    grid.layers.set(1);
    discs.add(grid);
  }
  discTop -= thick + DISC_GAP;
});
/* Exploded view offsets (scene units). Wider spread so the electronics get room. */
const E_RING = 4.2, E_WIND = 3.4, E_SCREW = 2.6, E_PTOP = 2.0, E_PBASE = 1.4;
const E_CURING = [0.95, 0.65], E_TAB = 0.3;
const E_FILL0 = -0.5, E_FILLSPAN = -5.8, E_BOTTOM = -6.5, E_BRACKET = -7.3;
const E_POST_TOP = -0.3, E_BOARD = [-0.5, -2.1, -3.7], E_COIL = -5.2, E_FERRITE = -5.9;
const xItems = [];
const addX = (o, dy) => { o.userData.y0 = o.position.y; xItems.push({ o, dy }); };
discs.children.slice(3, 5).forEach(o => addX(o, E_BOTTOM));
const FILLERS = 30, FILL_R = 1.9, FILL_IN = 1.2;
const fillerShape = new THREE.Shape();
fillerShape.absarc(0, 0, FILL_R, 0, Math.PI * 2, false);
const fillerHole = new THREE.Path();
fillerHole.absarc(0, 0, FILL_IN, 0, Math.PI * 2, true);
fillerShape.holes.push(fillerHole);
const fillerGeo = new THREE.ExtrudeGeometry(fillerShape, { depth: DISC_T, curveSegments: 128, bevelEnabled: false });
fillerGeo.translate(0, 0, -DISC_T / 2);
fillerGeo.rotateX(-Math.PI / 2);
const fillers = [];
let ghostOn = false;
function setGhost(on) {
  if (on === ghostOn) return;
  ghostOn = on;
  fillers.forEach(o => {
    if (o.geometry === fillerGeo) o.material = on ? fillerGhostMat : fillerGlowMat;
    if (on) o.layers.disable(1); else o.layers.enable(1);   // ghosts never hide the boards behind them
  });
}
for (let i = 1; i <= FILLERS; i++) {
  const t = i / (FILLERS + 1);
  const r = FILL_R;
  const y = (-PLATE_LAYER - DISC_T) - t * DISC_GAP;
  const fd = new THREE.Mesh(fillerGeo, fillerGlowMat);
  fd.position.y = y;
  fd.layers.set(0);
  fd.layers.enable(1);
  discs.add(fd); fillers.push(fd);
  const fr = new THREE.Mesh(new THREE.TorusGeometry(r, 0.014, 8, 160), fillerRimMat);
  fr.rotation.x = Math.PI / 2;
  fr.position.y = y + DISC_T / 2;
  fr.layers.set(0);
  fr.layers.enable(1);

  const cn = new THREE.Group();                                 // connector: local +z points along the cable
  cn.position.copy(end);
  cn.quaternion.setFromUnitVectors(new THREE.Vector3(0, 0, 1), tan);
  const part = (geo, mat, x, y, z) => { const o = new THREE.Mesh(geo, mat); o.position.set(x, y, z); o.layers.set(1); cn.add(o); return o; };
  part(new THREE.BoxGeometry(0.15, 0.11, 0.2), housings[kind], 0, 0, 0.1);              // housing
  part(new THREE.BoxGeometry(0.06, 0.02, 0.1), housings[kind], 0, 0.065, 0.09);         // latch
  part(new THREE.BoxGeometry(0.15, 0.02, 0.03), housings[kind], 0, 0, 0.21);            // front lip
  [-1, 1].forEach(s => {
    if (kind === 0) part(new THREE.BoxGeometry(0.035, 0.035, 0.07), brassMat, s * 0.035, 0, 0.235);      // exposed male pins
    else {
      part(new THREE.CylinderGeometry(0.022, 0.022, 0.08, 14), steelMat, s * 0.035, 0, 0.24).rotation.x = Math.PI / 2;   // crimped ferrules
      part(new THREE.BoxGeometry(0.05, 0.05, 0.03), housings[kind], s * 0.035, 0, 0.215);
    }
  });
  tail.add(cn);
}
makeCable(0.4, [0xd62828, 0x15151a], 0);
makeCable(0.4 + Math.PI * 0.8, [0xf2c230, 0x2a6fdb], 1);
discs.add(tail);
addX(tail, E_BOTTOM);

function updateElectricity(now) { fillerGlowMat.uniforms.uTime.value = now; }
ring.add(discs);

let explodeTarget = 0, explodeNow = 0;
addX(plate.children[0], E_PBASE);
addX(plate.children[1], E_PTOP);
for (let j = 2; j < 5; j++) {
  const screw = plate.children[j];
  addX(screw, E_SCREW);
  addX(screw.children[3], E_TAB - E_SCREW);
}
addX(plate.children[5], E_CURING[0]);
addX(plate.children[6], E_CURING[1]);
function applyExplode(e) {
  ring.position.y = E_RING * e;
  windings.position.y = (E_WIND - E_RING) * e;
  plate.position.y = -E_RING * e;
  discs.position.y = -E_RING * e;
  xItems.forEach(({ o, dy }) => { o.position.y = o.userData.y0 + dy * e; });
  const postBot = FERRITE_TOP + E_FERRITE * e, postTop = POST_TOP + E_POST_TOP * e;
  post.scale.y = (postTop - postBot) / POST_H;
  post.position.y = (postTop + postBot) / 2;
  explodeAmt = e;
}

const composer = new THREE.EffectComposer(renderer);
composer.addPass(new THREE.RenderPass(scene, camera));
const bloom = new THREE.UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 1.25, 0.75, 0.1);
composer.addPass(bloom);

const pivot = new THREE.Group();
pivot.add(ring);
pivot.name = 'Ring Object';
scene.add(pivot);

/* Input: drag rotate, pinch / wheel zoom, tap pause, triple-tap explode */
const el = renderer.domElement;
const pointers = new Map();
let velX = 0, velY = 0, moved = 0, pinchStart = 0, zoomAtPinch = 1, spinning = true;
let tapCount = 0, lastTap = 0, spinBefore = true;

el.addEventListener('pointerdown', e => {
  el.setPointerCapture(e.pointerId);
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  el.style.cursor = 'grabbing';
  if (pointers.size === 1) moved = 0;
  if (pointers.size === 2) {
    const [a, b] = [...pointers.values()];
    pinchStart = Math.hypot(a.x - b.x, a.y - b.y);
    zoomAtPinch = zoomTarget;
  }
});
el.addEventListener('pointermove', e => {
  const p = pointers.get(e.pointerId);
  if (!p) return;
  const dx = e.clientX - p.x, dy = e.clientY - p.y;
  p.x = e.clientX; p.y = e.clientY;
  if (pointers.size === 1) {
    moved += Math.abs(dx) + Math.abs(dy);
    velY = dx * 0.006; velX = dy * 0.006;
    pivot.rotation.y += velY; pivot.rotation.x += velX;
  } else if (pointers.size === 2) {
    const [a, b] = [...pointers.values()];
    zoomTarget = Math.min(2.2, Math.max(0.5, zoomAtPinch * pinchStart / Math.hypot(a.x - b.x, a.y - b.y)));
    moved = 999;
  }
});
function endPointer(e) {
  const had = pointers.has(e.pointerId);
  pointers.delete(e.pointerId);
  el.style.cursor = 'grab';
  if (had && pointers.size === 0 && moved < 6) {
    const t = performance.now();
    if (t - lastTap > 450) { tapCount = 0; spinBefore = spinning; }
    tapCount++; lastTap = t;
    if (tapCount === 3) {
      explodeTarget = 1 - explodeTarget;
      spinning = spinBefore;
      tapCount = 0; lastTap = 0;
    } else spinning = !spinning;
  }
}
el.addEventListener('pointerup', endPointer);
el.addEventListener('pointercancel', endPointer);
el.addEventListener('wheel', e => {
  e.preventDefault();
  zoomTarget = Math.min(2.2, Math.max(0.5, zoomTarget * (1 + e.deltaY * 0.001)));
}, { passive: false });
addEventListener('resize', () => {
  renderer.setSize(innerWidth, innerHeight);
  composer.setSize(innerWidth, innerHeight);
});

let spinSpeed = 0;
function animate() {
  requestAnimationFrame(animate);
  const now = performance.now() / 1000;
  coreMat.uniforms.uIntensity.value = 1.0;
  coreMat.uniforms.uTime.value = now;

  spinSpeed += ((spinning ? 1 : 0) - spinSpeed) * 0.06;
  ring.rotation.y += 0.004 * spinSpeed;

  if (pointers.size === 0) {
    pivot.rotation.y += velY; pivot.rotation.x += velX;
    velX *= 0.94; velY *= 0.94;
  }
  explodeNow += (explodeTarget - explodeNow) * 0.07;
  applyExplode(explodeNow * explodeNow * (3 - 2 * explodeNow));
  setGhost(explodeNow > 0.02);
  updateElectricity(now);
  zoom += (zoomTarget - zoom) * 0.12;
  placeCamera();
  camera.layers.set(0);
  composer.render();
  camera.layers.set(1);
  renderer.autoClear = false;
  renderer.clearDepth();
  renderer.render(scene, camera);
  renderer.autoClear = true;
}
animate();
</script>
</body>
</html>
