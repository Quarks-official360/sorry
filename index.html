<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Landing Leg Rig</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
  /* Layout: one full-height 3D view with three buttons floating at the bottom. */
  :root {
    --bg: #eef0f2; --fg: #1b2127; --muted: #5b6670; --panel: #ffffff; --line: #cfd5da; --accent: #d9541e;
    --mono: ui-monospace, Menlo, Consolas, monospace;
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #14181c; --fg: #e6eaee; --muted: #9aa5af; --panel: #1d2329; --line: #323b43; --accent: #ff7a3d;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #14181c; --fg: #e6eaee; --muted: #9aa5af; --panel: #1d2329; --line: #323b43; --accent: #ff7a3d;
    color-scheme: dark;
  }
  html, body { height: 100%; }
  body {
    background: var(--bg); color: var(--fg); font-family: var(--sans);
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: 12px;
    display: flex; flex-direction: column;
  }
  #view { flex: 1; min-height: 0; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; position: relative; }
  #view canvas { display: block; width: 100%; height: 100%; touch-action: none; cursor: grab; }
  #hint { position: absolute; left: 10px; top: 8px; font: 12px var(--mono); color: #e8edf0; text-shadow: 0 1px 2px rgba(0,0,0,.6); pointer-events: none; }
  #bar { position: absolute; left: 12px; right: 12px; bottom: 12px; display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
  button {
    font: 500 14px var(--sans); color: var(--fg); background: var(--panel); border: 1px solid var(--line);
    border-radius: 4px; padding: 9px 16px; cursor: pointer;
  }
  button.primary { color: #fff; background: var(--accent); border-color: var(--accent); min-width: 88px; }
  button[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); }
  button:focus-visible { outline: 2px solid var(--fg); outline-offset: 2px; }
</style>
<style>body { margin: 0; font-size: 14px; } [hidden] { display: none !important; }</style>
</head>
<body>
<div id="view">
  <div id="hint">drag to orbit · scroll or pinch to zoom</div>
  <div id="bar">
    <button id="go" class="primary" type="button">Land</button>
    <button id="camA" type="button" aria-pressed="true">Whole rocket</button>
    <button id="camB" type="button" aria-pressed="false">Leg close-up</button>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function () {
  /* ---------- Leg mechanism (SI units, 1 scene unit = 1 m) ----------
     Hinge P on the body. The body joint B sits c above P and s inboard of it (toward the body).
     The leg joint A sits ON the leg axis, d out from P, so the rod end is pinned straight to the leg:
       A = P + d (sin(theta), cos(theta)),   B = P + (-s, c),   theta measured from straight up, outward positive.
     The actuator is the only input. Its length L = |A - B| is set, and the leg angle follows from the triangle P-B-A:
       L^2 = d^2 + rB^2 - 2 d rB cos(theta + beta),   rB = hypot(s, c),   beta = atan2(s, c)
       theta = acos((d^2 + rB^2 - L^2) / (2 d rB)) - beta.
     The standoff s keeps B off the leg line when stowed, so the actuator has leverage from the first millimetre. */
  var l = 2.6;                                     // leg length
  var RB = 1.0;                                    // booster radius
  var thMax = 141.33 * Math.PI / 180;              // leg angle at touchdown
  var hingeY = 0.35 - l * Math.cos(thMax);         // hinge height when landed: the foot ball joint sits 0.35 m above a flat pad
  var d = 1.0, s = 0.4, c = 2.9;
  var T = 2.5;                                     // leg deploy time
  var rB = Math.hypot(s, c), beta = Math.atan2(s, c);

  function PXof() { return RB + s + 0.15; }       // hinge distance from the booster axis
  function Lof(th) { return Math.sqrt(d * d + rB * rB - 2 * d * rB * Math.cos(th + beta)); }
  function thOf(L) { var cp = (d * d + rB * rB - L * L) / (2 * d * rB); return Math.acos(Math.max(-1, Math.min(1, cp))) - beta; }
  function mj(u) { u = Math.max(0, Math.min(1, u)); return u * u * u * (10 - 15 * u + 6 * u * u); }  // min-jerk 0..1
  var Lmin = Lof(0), Lmax = Lof(thMax), stroke = Lmax - Lmin;

  /* ---------- Scene ---------- */
  var view = document.getElementById('view');
  var scene = new THREE.Scene();
  var camera = new THREE.PerspectiveCamera(40, 1, 0.5, 400);
  var renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.shadowMap.enabled = true;
  view.appendChild(renderer.domElement);
  scene.add(new THREE.HemisphereLight(0xdfe8f2, 0x5b6168, 0.8));
  var sun = new THREE.DirectionalLight(0xffffff, 0.95);
  sun.position.set(14, 30, 10);
  sun.castShadow = true;
  sun.shadow.mapSize.set(2048, 2048);
  sun.shadow.camera.left = -26; sun.shadow.camera.right = 26; sun.shadow.camera.top = 26; sun.shadow.camera.bottom = -26;
  sun.shadow.camera.near = 1; sun.shadow.camera.far = 100;
  sun.shadow.bias = -0.0006;
  scene.add(sun);

  var M = function (col, mt, r) { return new THREE.MeshStandardMaterial({ color: col, metalness: mt, roughness: r, side: THREE.DoubleSide }); };
  var white = M(0xe9edef, 0.1, 0.5), black = M(0x1c1f22, 0.3, 0.6), soot = M(0x34383c, 0.2, 0.8),
      steel = M(0x4a5560, 0.6, 0.45), orange = M(0xe0652a, 0.2, 0.55), chrome = M(0xd5dade, 0.9, 0.25),
      dark = M(0x23282d, 0.5, 0.5), ti = M(0x8d9398, 0.8, 0.4), nozzle = M(0x2f3338, 0.7, 0.4), skirt = M(0x575d63, 0.5, 0.6);

  // Landing pad
  var pad0 = new THREE.Mesh(new THREE.CircleGeometry(40, 64), M(0x80868b, 0.0, 0.95));
  pad0.rotation.x = -Math.PI / 2; pad0.position.y = -0.02; pad0.receiveShadow = true; scene.add(pad0);
  var padC = new THREE.Mesh(new THREE.CircleGeometry(8, 64), M(0xa9aeb2, 0.0, 0.9));
  padC.rotation.x = -Math.PI / 2; padC.position.y = -0.01; padC.receiveShadow = true; scene.add(padC);
  var padRing = new THREE.Mesh(new THREE.RingGeometry(6.6, 6.8, 64), new THREE.MeshBasicMaterial({ color: 0xf2f2f0 }));
  padRing.rotation.x = -Math.PI / 2; padRing.position.y = 0.0; scene.add(padRing);
  [Math.PI / 4, -Math.PI / 4].forEach(function (a) {
    var bar = new THREE.Mesh(new THREE.PlaneGeometry(13, 0.45), new THREE.MeshBasicMaterial({ color: 0xf2f2f0 }));
    bar.rotation.x = -Math.PI / 2; bar.rotation.z = a; bar.position.y = 0.0; scene.add(bar);
  });

  // Rocket group: origin at the pad when landed
  var rocket = new THREE.Group();
  scene.add(rocket);
  function cyl(rt, rb, h, y, mat, seg) {
    var mm = new THREE.Mesh(new THREE.CylinderGeometry(rt, rb, h, seg || 48), mat);
    mm.position.y = y; rocket.add(mm); return mm;
  }
  cyl(RB, RB, 11.1, 1.9 + 11.1 / 2, white);                // first stage tank, y 1.9 to 13.0
  cyl(RB + 0.004, RB + 0.004, 1.1, 1.9 + 0.55, soot);       // sooted base
  [4.4, 6.9, 9.4, 11.6].forEach(function (y) { cyl(RB + 0.006, RB + 0.006, 0.04, y, dark); });
  cyl(RB + 0.002, RB + 0.002, 1.4, 13.7, black);            // interstage, y 13.0 to 14.4
  cyl(RB, RB, 4.0, 16.4, white);                            // second stage, y 14.4 to 18.4
  cyl(RB + 0.004, RB + 0.004, 0.05, 14.45, dark);
  var pts = [], k;
  for (k = 0; k <= 28; k++) { var su = k / 28; pts.push(new THREE.Vector2(RB * Math.sqrt(Math.max(0, 1 - Math.pow(su, 1.8))), 18.4 + 4.2 * su)); }
  var fairing = new THREE.Mesh(new THREE.LatheGeometry(pts, 48), white);
  rocket.add(fairing);
  cyl(0.97, 0.97, 0.4, 1.7, skirt);                         // engine skirt
  var nz = [[0, 0]];
  for (k = 0; k < 8; k++) nz.push([0.6 * Math.cos(k * Math.PI / 4), 0.6 * Math.sin(k * Math.PI / 4)]);
  nz.forEach(function (p) {
    var n = new THREE.Mesh(new THREE.CylinderGeometry(0.09, 0.19, 0.85, 20, 1, true), nozzle);
    n.position.set(p[0], 1.075, p[1]); rocket.add(n);
  });
  var plumes = [];
  [[0.2, 2.8, 0xffb25a, 0.55], [0.13, 2.2, 0xfff1c8, 0.7]].forEach(function (cfg) {
    var pm = new THREE.Mesh(new THREE.ConeGeometry(cfg[0], cfg[1], 20, 1, true),
      new THREE.MeshBasicMaterial({ color: cfg[2], transparent: true, opacity: cfg[3], blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.DoubleSide }));
    pm.rotation.x = Math.PI; pm.position.set(0, 0.65 - cfg[1] / 2, 0); pm.userData.len = cfg[1];
    rocket.add(pm); plumes.push(pm);
  });

  function zCyl(r, len, mat) {
    var mm = new THREE.Mesh(new THREE.CylinderGeometry(r, r, len, 24), mat);
    mm.rotation.x = Math.PI / 2;
    return mm;
  }

  /* Fins: four small swept fins at the top of the first stage, exactly where the grid fins were.
     Each fin is an all-moving surface on a radial shaft, so it can be steered about its own mid-chord.
     They sit at neutral for now; steerFins() turns them (degrees). */
  var tailFins = [];
  function createTailFin(az) {
    var g = new THREE.Group(); g.rotation.y = az; g.position.y = 13.85; rocket.add(g);
    var steer = new THREE.Group(); steer.position.x = RB - 0.04; g.add(steer);
    var sh = new THREE.Shape();
    sh.moveTo(0, 0.6); sh.lineTo(0.7, -0.05); sh.lineTo(0.7, -0.6); sh.lineTo(0, -0.6); sh.lineTo(0, 0.6);
    var geo = new THREE.ExtrudeGeometry(sh, { depth: 0.06, bevelEnabled: false });
    geo.translate(0, 0, -0.03);
    var blade = new THREE.Mesh(geo, ti);
    var shaft = new THREE.Mesh(new THREE.CylinderGeometry(0.045, 0.045, 0.3, 16), chrome);
    shaft.rotation.z = Math.PI / 2; shaft.position.x = 0.1;
    steer.add(blade, shaft);
    tailFins.push(steer);
  }
  for (k = 0; k < 4; k++) createTailFin(k * Math.PI / 2);
  // steerFins(10) turns all four by 10 deg; steerFins([a, b, c, d]) sets each fin on its own
  window.steerFins = function (deg) {
    tailFins.forEach(function (st, i) {
      var v = Array.isArray(deg) ? deg[i] : deg;
      st.rotation.x = (v || 0) * Math.PI / 180;
    });
  };

  /* Landing legs: four copies of the same mechanism, 45 deg between the grid fins.
     Each leg is an A-frame of two tapered struts with cross-braces, hinged at the root between two pylon plates.
     The actuator sits in the middle plane, between the struts, and its rod-end eye is pinned on a cross axle
     that spans the struts at the leg joint, so it is joined to the leg directly. */
  function tube(parent, p1, p2, r, mat) {
    var a = new THREE.Vector3(p1[0], p1[1], p1[2]), b = new THREE.Vector3(p2[0], p2[1], p2[2]);
    var dir = b.clone().sub(a), len = dir.length();
    var mm = new THREE.Mesh(new THREE.CylinderGeometry(r, r, len, 14), mat);
    mm.position.copy(a.clone().add(b).multiplyScalar(0.5));
    mm.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), dir.normalize());
    parent.add(mm);
    return mm;
  }
  var core = M(0xc9a24a, 0.4, 0.6);
  var legs = [];
  var W0 = 0.30, W1 = 0.075;                                  // half-width of the A-frame at the hinge and at the foot
  function wAt(y) { return W0 + (W1 - W0) * y / l; }
  function createLeg(alpha) {
    var g = new THREE.Group(); g.rotation.y = alpha; rocket.add(g);
    var o = { plates: [], bplates: [] };
    var hingeG = new THREE.Group(); g.add(hingeG);
    [-1, 1].forEach(function (sg) {
      var pl = new THREE.Mesh(new THREE.BoxGeometry(1, 0.36, 0.05), steel); pl.userData.sg = sg; hingeG.add(pl); o.plates.push(pl);
      var bp = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.3, 0.04), steel); bp.userData.sg = sg; g.add(bp); o.bplates.push(bp);
    });
    var hAxle = zCyl(0.06, 0.84, chrome); hingeG.add(hAxle);
    // Leg
    var arm = new THREE.Group(); hingeG.add(arm);
    [-1, 1].forEach(function (sg) {
      tube(arm, [0, 0, sg * W0], [0, l, sg * W1], 0.045, orange);
      var eye = zCyl(0.1, 0.09, orange); eye.position.set(0, 0, sg * W0); arm.add(eye);
    });
    tube(arm, [0, 0.35, -wAt(0.35)], [0, 0.35, wAt(0.35)], 0.03, orange);
    [1.85, 2.3].forEach(function (y) { tube(arm, [0, y, -wAt(y)], [0, y, wAt(y)], 0.03, orange); });
    tube(arm, [0, 1.85, -wAt(1.85)], [0, 2.3, wAt(2.3)], 0.02, orange);
    tube(arm, [0, 1.85, wAt(1.85)], [0, 2.3, -wAt(2.3)], 0.02, orange);
    var axle = zCyl(0.04, 1, chrome); arm.add(axle);
    // Foot: ball joint, crush core and a dished pad that lies flat at touchdown
    var foot = new THREE.Group(); foot.position.set(0, l, 0); foot.rotation.z = thMax; arm.add(foot);
    var ball = new THREE.Mesh(new THREE.SphereGeometry(0.11, 20, 14), steel);
    var crush = new THREE.Mesh(new THREE.CylinderGeometry(0.14, 0.14, 0.24, 24), core); crush.position.y = -0.17;
    var fpad = new THREE.Mesh(new THREE.CylinderGeometry(0.34, 0.37, 0.06, 32), dark); fpad.position.y = -0.32;
    foot.add(ball, crush, fpad);
    // Actuator, in the middle plane
    var act = new THREE.Group(); g.add(act);
    var body = new THREE.Mesh(new THREE.CylinderGeometry(0.075, 0.075, 1, 28), dark);
    var motor = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.1, 0.3, 28), steel); motor.position.y = 0.15;
    var rod = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.04, 1, 20), chrome);
    var eyeA = zCyl(0.07, 0.12, chrome);
    act.add(body, motor, rod, eyeA);
    var bpin = zCyl(0.045, 0.36, chrome); g.add(bpin);
    o.g = g; o.hingeG = hingeG; o.arm = arm; o.axle = axle; o.act = act; o.body = body; o.rod = rod; o.eyeA = eyeA; o.bpin = bpin;
    legs.push(o);
  }
  for (k = 0; k < 4; k++) createLeg(Math.PI / 4 + k * Math.PI / 2);

  rocket.traverse(function (o) { if (o.isMesh && o.material !== plumes[0].material && o.material !== plumes[1].material) o.castShadow = true; });

  var bodyLen = 1, rodStart = 0.1;
  function layout() {
    var PX = PXof(), By = hingeY + c, BX = PX - s;
    bodyLen = 0.95 * Lmin; rodStart = 0.1 * bodyLen;
    legs.forEach(function (o) {
      o.hingeG.position.set(PX, hingeY, 0);
      o.plates.forEach(function (pl) {
        pl.scale.x = s + 0.3; pl.position.set(-(s + 0.1) / 2, 0, pl.userData.sg * (W0 + 0.07));
      });
      o.bplates.forEach(function (bp) { bp.position.set(RB + 0.08, By, bp.userData.sg * 0.13); });
      o.bpin.position.set(BX, By, 0);
      o.act.position.set(BX, By, 0);
      o.axle.position.set(0, d, 0); o.axle.scale.y = 2 * wAt(d) + 0.1;
      o.body.scale.y = bodyLen; o.body.position.y = bodyLen / 2;
    });
  }
  // The actuator length is the input. The leg angle is solved from it and every leg is posed from that.
  function pose(x) {
    var L = Lmin + x, th = thOf(L), PX = PXof(), BX = PX - s, By = hingeY + c;
    var Ax = PX + d * Math.sin(th), Ay = hingeY + d * Math.cos(th);
    var ang = Math.atan2(Ay - By, Ax - BX) - Math.PI / 2;
    var rl = Math.max(0.02, L - rodStart);
    legs.forEach(function (o) {
      o.arm.rotation.z = -th;
      o.act.rotation.z = ang;
      o.rod.scale.y = rl; o.rod.position.y = rodStart + rl / 2;
      o.eyeA.position.y = L;
    });
    return { L: L, th: th };
  }

  /* ---------- Orbit camera with presets ---------- */
  var target = new THREE.Vector3(0, 11, 0);
  var rad = 46, az = 0.9, pol = 1.4;
  var goal = { az: 0.9, pol: 1.4, rad: 46, tx: 0, ty: 11, tz: 0, k: 0.5 }, animating = false;
  var PRESET = {
    whole: { az: 0.9, pol: 1.4, rad: 46, tx: 0, ty: 11, tz: 0, k: 0.5 },
    leg: { az: Math.PI / 4, pol: 1.5, rad: 12.5, tx: 2.3 * Math.cos(Math.PI / 4), ty: 3.0, tz: -2.3 * Math.sin(Math.PI / 4), k: 1 }
  };
  function placeCam() {
    camera.position.set(
      target.x + rad * Math.sin(pol) * Math.sin(az),
      target.y + rad * Math.cos(pol),
      target.z + rad * Math.sin(pol) * Math.cos(az));
    camera.lookAt(target);
  }
  var ptrs = new Map(), lastPinch = 0, cv = renderer.domElement;
  cv.addEventListener('pointerdown', function (ev) { animating = false; cv.setPointerCapture(ev.pointerId); ptrs.set(ev.pointerId, ev); cv.style.cursor = 'grabbing'; });
  cv.addEventListener('pointerup', function (ev) { ptrs.delete(ev.pointerId); lastPinch = 0; cv.style.cursor = 'grab'; });
  cv.addEventListener('pointercancel', function (ev) { ptrs.delete(ev.pointerId); lastPinch = 0; });
  cv.addEventListener('pointermove', function (ev) {
    if (!ptrs.has(ev.pointerId)) return;
    var prev = ptrs.get(ev.pointerId);
    if (ptrs.size === 1) {
      az -= (ev.clientX - prev.clientX) * 0.008;
      pol = Math.max(0.2, Math.min(Math.PI - 0.2, pol - (ev.clientY - prev.clientY) * 0.008));
    }
    ptrs.set(ev.pointerId, ev);
    if (ptrs.size === 2) {
      var a = Array.from(ptrs.values());
      var dist = Math.hypot(a[0].clientX - a[1].clientX, a[0].clientY - a[1].clientY);
      if (lastPinch) rad = Math.max(3, Math.min(90, rad * lastPinch / dist));
      lastPinch = dist;
    }
  });
  cv.addEventListener('wheel', function (ev) {
    ev.preventDefault(); animating = false;
    rad = Math.max(3, Math.min(90, rad * (1 + ev.deltaY * 0.001)));
  }, { passive: false });
  function resize() {
    var w = view.clientWidth, h = view.clientHeight;
    if (!w || !h) return;
    renderer.setSize(w, h, false);
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
  }
  new ResizeObserver(resize).observe(view);

  /* ---------- Landing sequence ---------- */
  var $ = function (id) { return document.getElementById(id); };
  var H0 = 10, hAlt = H0, x = 0, state = 'idle', tSeq = 0;
  var tl = 3.0, Ttot = tl + T + 3.0;               // leg rods start at 3 s; touchdown 3 s after they finish
  var goBtn = $('go');
  goBtn.addEventListener('click', function () {
    if (state === 'idle') { hAlt = H0; x = 0; tSeq = 0; state = 'land'; goBtn.textContent = 'Reset'; }
    else { state = 'idle'; hAlt = H0; x = 0; goBtn.textContent = 'Land'; }
  });
  function setCam(name) {
    goal = PRESET[name]; animating = true;
    $('camA').setAttribute('aria-pressed', name === 'whole'); $('camB').setAttribute('aria-pressed', name === 'leg');
  }
  $('camA').addEventListener('click', function () { setCam('whole'); });
  $('camB').addEventListener('click', function () { setCam('leg'); });

  var last = performance.now();
  function frame(now) {
    var dt = Math.min(0.05, (now - last) / 1000); last = now;
    var burn = 0;
    if (state === 'land') {
      tSeq += dt;
      hAlt = H0 * (1 - mj(tSeq / Ttot));
      x = stroke * mj((tSeq - tl) / T);
      burn = Math.max(0, Math.min(1, (Ttot - 0.3 - tSeq) / 0.4));
      if (tSeq >= Ttot) { state = 'landed'; hAlt = 0; x = stroke; burn = 0; }
    }
    rocket.position.y = hAlt;
    pose(x);
    plumes.forEach(function (pm, i) {
      pm.visible = burn > 0.01;
      var fl = 1 + 0.1 * Math.sin(now * 0.06 + i * 2);
      pm.scale.set(burn, burn * fl, burn);
      pm.position.y = 0.65 - pm.userData.len * burn * fl / 2;
    });
    if (animating) {
      az += (goal.az - az) * 0.08; pol += (goal.pol - pol) * 0.08; rad += (goal.rad - rad) * 0.08;
      target.x += (goal.tx - target.x) * 0.1; target.z += (goal.tz - target.z) * 0.1;
      if (Math.abs(goal.az - az) < 0.002 && Math.abs(goal.rad - rad) < 0.05) animating = false;
    }
    target.y += (goal.ty + goal.k * hAlt - target.y) * 0.25;
    placeCam();
    renderer.render(scene, camera);
    requestAnimationFrame(frame);
  }
  resize(); layout(); placeCam();
  requestAnimationFrame(frame);
})();
</script>

</body>
</html>
