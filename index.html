<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>reactor</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  canvas { display: block; touch-action: none; cursor: grab; }
</style>
</head>
<body>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/CopyShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script>
<script>
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x000000);          // pitch black
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(40, innerWidth / innerHeight, 0.1, 200);

/* Camera: looking down at an angle, slightly rolled */
const ELEVATION = 42 * Math.PI / 180;
const ROLL = 0.55;
let zoom = 1, zoomTarget = 1;
function placeCamera() {
  const aspect = innerWidth / innerHeight;
  const dist = 15.5 * Math.max(1, 1 / aspect) * zoom;
  camera.position.set(0, Math.sin(ELEVATION) * dist, Math.cos(ELEVATION) * dist);
  camera.up.set(Math.sin(ROLL), Math.cos(ROLL), 0);
  camera.lookAt(0, 0, 0);
  camera.aspect = aspect;
  camera.updateProjectionMatrix();
}
placeCamera();

/* Lighting */
/* Layer 0 = glowing ring (goes through bloom). Layer 1 = ribs + copper (drawn after, no bloom). */
const amb = new THREE.AmbientLight(0xffffff, 0.85);
amb.layers.enable(1);
scene.add(amb);
const sun = new THREE.DirectionalLight(0xffffff, 0.7);
sun.position.set(4, 10, 6);
sun.layers.enable(1);
scene.add(sun);

/* The ring: one solid piece, flat annulus with thickness */
const R_IN = 2.0, R_OUT = 3.1, THICK = 0.8;
const shape = new THREE.Shape();
shape.absarc(0, 0, R_OUT, 0, Math.PI * 2, false);
const hole = new THREE.Path();
hole.absarc(0, 0, R_IN, 0, Math.PI * 2, true);
shape.holes.push(hole);

const geo = new THREE.ExtrudeGeometry(shape, {
  depth: THICK, curveSegments: 160, bevelEnabled: false
});
geo.translate(0, 0, -THICK / 2);
geo.rotateX(-Math.PI / 2);                 // lie flat; axis = Y

/* Hollow look: see-through body with a faint blue glow that is stronger
   toward the edges (fresnel) and almost empty in the middle */
const glowMat = new THREE.ShaderMaterial({
  transparent: true, depthWrite: false, side: THREE.DoubleSide,
  blending: THREE.AdditiveBlending,
  vertexShader: `
    varying vec3 vN, vV;
    void main(){
      vec4 mv = modelViewMatrix * vec4(position, 1.0);
      vN = normalize(normalMatrix * normal);
      vV = normalize(-mv.xyz);
      gl_Position = projectionMatrix * mv;
    }`,
  fragmentShader: `
    varying vec3 vN, vV;
    void main(){
      float f = pow(1.0 - abs(dot(normalize(vN), normalize(vV))), 2.2);
      float a = 0.20 + 0.45 * f;                      // translucent body, brighter rim
      vec3 c = vec3(0.04, 0.38, 1.0) * (0.9 + 1.4 * f);
      gl_FragColor = vec4(c * a, a);
    }`
});
const ring = new THREE.Mesh(geo, glowMat);

/* Thin bright-blue outline on the four rim circles (top/bottom, inner/outer) */
const edgeMat = new THREE.MeshBasicMaterial({ color: 0x2f86ff });
[R_IN, R_OUT].forEach(r => [-THICK / 2, THICK / 2].forEach(y => {
  const t = new THREE.Mesh(new THREE.TorusGeometry(r, 0.014, 8, 240), edgeMat);
  t.rotation.x = Math.PI / 2;
  t.position.y = y;
  ring.add(t);
}));

/* Soft light source running through the middle of the ring */
const coreMat = new THREE.ShaderMaterial({
  transparent: true, depthWrite: false, blending: THREE.NormalBlending,
  uniforms: { uTime: { value: 0 }, uIntensity: { value: 1 } },
  vertexShader: `
    varying vec3 vN, vV, vP;
    void main(){
      vP = position;
      vec4 mv = modelViewMatrix * vec4(position, 1.0);
      vN = normalize(normalMatrix * normal);
      vV = normalize(-mv.xyz);
      gl_Position = projectionMatrix * mv;
    }`,
  fragmentShader: `
    varying vec3 vN, vV, vP;
    uniform float uTime, uIntensity;
    void main(){
      /* Uniform plasma: no hot spots, streaks, or localized bright patches. */
      float a = 0.62 * uIntensity;
      vec3 col = vec3(0.22, 0.62, 1.0);
      gl_FragColor = vec4(col, a);
    }`
});
const PLASMA_RADIUS = (R_IN + R_OUT) / 2;
// No continuous torus/core mesh: plasma is made ONLY from separate particles.
// Keeping the shader object lets the existing animation loop run without errors,
// but it is intentionally not attached to the scene.

/* Individual charged-looking particles streaming through the plasma tube. */
const PARTICLE_COUNT = 1600; // dense field of clearly discrete particles
const particlePositions = new Float32Array(PARTICLE_COUNT * 3);
const particleAngles = new Float32Array(PARTICLE_COUNT * 2);
const particleSpeeds = new Float32Array(PARTICLE_COUNT);
for (let i = 0; i < PARTICLE_COUNT; i++) {
  particlePositions[i * 3] = 0;
  particlePositions[i * 3 + 1] = 0;
  particlePositions[i * 3 + 2] = 0;
  // Stratified placement: evenly spaced around the ring, with an independent
  // golden-angle distribution through the tube cross-section. This keeps the
  // particle circle concentric instead of drifting or bunching into patches.
  particleAngles[i * 2] = (i / PARTICLE_COUNT) * Math.PI * 2;
  particleAngles[i * 2 + 1] = i * 2.399963229728653;
  particleSpeeds[i] = 0.8;
}
const particleGeo = new THREE.BufferGeometry();
particleGeo.setAttribute('position', new THREE.BufferAttribute(particlePositions, 3));
particleGeo.setAttribute('aAngles', new THREE.BufferAttribute(particleAngles, 2));
particleGeo.setAttribute('aSpeed', new THREE.BufferAttribute(particleSpeeds, 1));
const particleMat = new THREE.ShaderMaterial({
  transparent: true, depthWrite: false, blending: THREE.NormalBlending,
  uniforms: { uTime: { value: 0 } },
  vertexShader: `
    attribute vec2 aAngles;
    attribute float aSpeed;
    uniform float uTime;
    void main() {
      float phi = aAngles.x + uTime * aSpeed;
      float psi = aAngles.y + uTime * 0.8;
      float tube = 0.36;
      float radius = 2.55 + tube * cos(psi);
      vec3 p = vec3(radius * cos(phi), tube * sin(psi), radius * sin(phi));
      vec4 mv = modelViewMatrix * vec4(p, 1.0);
      gl_Position = projectionMatrix * mv;
      gl_PointSize = 2.6;
    }`,
  fragmentShader: `
    void main() {
      vec2 q = gl_PointCoord - vec2(0.5);
      float d = length(q);
      if (d > 0.5) discard;
      /* Every particle has the same flat brightness, with no luminous core. */
      float a = 0.88;
      vec3 col = vec3(0.34, 0.76, 1.0);
      gl_FragColor = vec4(col, a);
    }`
});
const plasmaParticles = new THREE.Points(particleGeo, particleMat);
plasmaParticles.frustumCulled = false;
ring.add(plasmaParticles);

/* ------------------------------------------------------------------
   16 wrap lines = 8 pairs.
   Each line goes exactly one full turn around the ring's cross-section
   (over the top, outer wall, bottom, inner wall) and closes on itself.
   The two lines in a pair sit close together; pairs are evenly spread
   around the ring, so they are far from each other.
------------------------------------------------------------------- */
const PAIRS = 8;
const PAIR_HALF_GAP = 0.135;               // radians: half the distance inside a pair
const RIB_WIDTH = 0.10; const RIB_HEIGHT = 0.07;                 // line thickness
const wrapMat = new THREE.MeshPhysicalMaterial({ color: 0xb8c5d8, metalness: 1.0, roughness: 0.14, clearcoat: 1.0, clearcoatRoughness: 0.08, emissive: 0x151d2a, emissiveIntensity: 0.12, side: THREE.DoubleSide });

/* Rounded-rectangle outline of the ring's cross-section, as (r, y) points */
function crossSection() {
  const eps = 0.012;                       // sit just outside the surface
  const w = (R_OUT - R_IN) / 2;
  const h = THICK / 2;
  const rc = 0.1;                          // corner rounding
  const rMid = (R_IN + R_OUT) / 2;
  const pts = [];
  const corners = [
    [ w - rc,  h - rc, 0],
    [-(w - rc), h - rc, Math.PI / 2],
    [-(w - rc), -(h - rc), Math.PI],
    [ w - rc, -(h - rc), Math.PI * 1.5]
  ];
  corners.forEach(([cx, cy, a0]) => {
    for (let i = 0; i <= 8; i++) {
      const a = a0 + (i / 8) * Math.PI / 2;
      pts.push([rMid + cx + rc * Math.cos(a), cy + rc * Math.sin(a), Math.cos(a), Math.sin(a)]);
    }
  });
  return pts;
}
const section = crossSection();

/* A raised rib: starts exactly on the ring surface and stands out from it
   (never goes inside). Profile = rectangle RIB_WIDTH wide, RIB_HEIGHT tall. */
function makeWrap(phi) {
  const c = Math.cos(phi), s = Math.sin(phi);
  const tx = -s, tz = c;                                   // direction along the ring
  const hw = RIB_WIDTH / 2;
  const prof = [[-hw, 0], [-hw, RIB_HEIGHT], [hw, RIB_HEIGHT], [hw, 0]];   // (sideways, outward)
  const N = section.length;
  const pos = [], idx = [];
  for (let side = 0; side < 3; side++) {                   // left wall, top, right wall
    const base = pos.length / 3;
    for (let i = 0; i < N; i++) {
      const [r, y, nr, ny] = section[i];
      [prof[side], prof[side + 1]].forEach(([u, v]) => {
        const rr = r + nr * v, yy = y + ny * v;
        pos.push(rr * c + tx * u, yy, rr * s + tz * u);
      });
    }
    for (let i = 0; i < N; i++) {
      const a = base + i * 2, b = base + ((i + 1) % N) * 2;
      idx.push(a, a + 1, b, b, a + 1, b + 1);
    }
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setIndex(idx);
  g.computeVertexNormals();
  const rib = new THREE.Mesh(g, wrapMat);
  rib.layers.set(1);                       // no bloom
  return rib;
}

/* Copper wire winding: round wire looped around the ring's cross-section,
   turn after turn, filling the gap between the two ribs of every pair.
   One wire loop is built once and reused (rotated) for every turn. */
const group1 = new THREE.Group();          // "Group 1": all 16 black lines
group1.name = 'Group 1';
ring.add(group1);
const WIRE_R = 0.02;                       // wire radius
const WIRES_PER_GAP = 22;                  // turns of wire in each pair's gap (packed so the gap is filled)
const WIRE_SPAN = PAIR_HALF_GAP - 0.036;   // keep wire clear of the (wider) ribs
/* Realistic copper: a metal material that reflects a small studio-style environment
   (bright softbox above, dark floor, a few light strips), so the wire gets real
   copper highlights, mid-tones and dark edges instead of a flat orange. */
function makeStudioEnv() {
  const faces = [];
  for (let f = 0; f < 6; f++) {
    const c = document.createElement('canvas');
    c.width = c.height = 128;
    const g = c.getContext('2d');
    const grad = g.createLinearGradient(0, 0, 0, 128);
    if (f === 2) { grad.addColorStop(0, '#ffffff'); grad.addColorStop(1, '#d8d8d8'); }        // +Y: bright softbox
    else if (f === 3) { grad.addColorStop(0, '#1a1a1a'); grad.addColorStop(1, '#0c0c0c'); }   // -Y: dark floor
    else {                                                                                    // sides: sky to dark ground
      grad.addColorStop(0, '#f2f2f2'); grad.addColorStop(0.45, '#9a9a9a');
      grad.addColorStop(0.55, '#3a3a3a'); grad.addColorStop(1, '#161616');
    }
    g.fillStyle = grad; g.fillRect(0, 0, 128, 128);
    if (f !== 2 && f !== 3) {                                                                 // light strips
      g.fillStyle = '#ffffff'; g.fillRect(20 + f * 7, 0, 14, 128); g.fillRect(88 - f * 5, 0, 8, 128);
    }
    faces.push(c);
  }
  const tex = new THREE.CubeTexture(faces);
  tex.needsUpdate = true;
  return tex;
}
const copperMat = new THREE.MeshStandardMaterial({
  color: 0xf0a47c,                         // copper's warm pink-orange reflectance
  metalness: 1.0, roughness: 0.28,
  envMap: makeStudioEnv(), envMapIntensity: 1.25
});
const wirePts = section.map(([r, y, nr, ny]) => new THREE.Vector3(r + nr * WIRE_R, y + ny * WIRE_R, 0));
const wireGeo = new THREE.TubeGeometry(new THREE.CatmullRomCurve3(wirePts, true, 'centripetal'), 160, WIRE_R, 8, true);

for (let k = 0; k < PAIRS; k++) {
  const center = (k / PAIRS) * Math.PI * 2;
  group1.add(makeWrap(center - PAIR_HALF_GAP));
  group1.add(makeWrap(center + PAIR_HALF_GAP));
  for (let i = 0; i < WIRES_PER_GAP; i++) {
    const phi = center - WIRE_SPAN + (i / (WIRES_PER_GAP - 1)) * 2 * WIRE_SPAN;
    const wire = new THREE.Mesh(wireGeo, copperMat);
    wire.rotation.y = -phi;
    wire.layers.set(1);                    // no bloom
    ring.add(wire);
  }
}

/* ------------------------------------------------------------------
   Plate: sits inside the ring's inner hole, outer edge touching the ring.
   It is hollow (round hole in the middle, medium-width band) and its upper
   surface is covered with slot grooves (rectangle with round ends, like two
   holes merged). Built as a solid base layer + a top layer with the slots
   cut through it, so the slots are real recessed grooves.
------------------------------------------------------------------- */
const PLATE_R_OUT = R_IN;                  // touches the ring's inner wall
const PLATE_R_HOLE = 1.1;                  // middle cut-out
const PLATE_LAYER = 0.12;                  // thickness of each layer (= groove depth)
const SLOT_COUNT = 24, SLOT_LEN = 0.72, SLOT_W = 0.2;
const SCREW_COUNT = 3;                     // hex screws; the slot at each screw spot is left out
const SLOT_MID_R = (PLATE_R_OUT + PLATE_R_HOLE) / 2;

function plateShape(withSlots) {
  const sh = new THREE.Shape();
  sh.absarc(0, 0, PLATE_R_OUT, 0, Math.PI * 2, false);
  const mid = new THREE.Path();
  mid.absarc(0, 0, PLATE_R_HOLE, 0, Math.PI * 2, true);
  sh.holes.push(mid);
  if (withSlots) {
    for (let k = 0; k < SLOT_COUNT; k++) {
      if (k % (SLOT_COUNT / SCREW_COUNT) === 0) continue;   // solid spot for a screw
      const a = (k / SLOT_COUNT) * Math.PI * 2;
      const ca = Math.cos(a), sa = Math.sin(a);
      const half = SLOT_LEN / 2 - SLOT_W / 2;
      const pts = [];
      for (let i = 0; i <= 12; i++) {       // round end on the outer side
        const t = -Math.PI / 2 + (i / 12) * Math.PI;
        pts.push([half + (SLOT_W / 2) * Math.cos(t), (SLOT_W / 2) * Math.sin(t)]);
      }
      for (let i = 0; i <= 12; i++) {       // round end on the inner side
        const t = Math.PI / 2 + (i / 12) * Math.PI;
        pts.push([-half + (SLOT_W / 2) * Math.cos(t), (SLOT_W / 2) * Math.sin(t)]);
      }
      const world = pts.map(([lx, ly]) => {
        const x = SLOT_MID_R + lx;          // slot lies along the radius
        return new THREE.Vector2(x * ca - ly * sa, x * sa + ly * ca);
      });
      sh.holes.push(new THREE.Path(world));
    }
  }
  return sh;
}

const plateMat = new THREE.MeshPhongMaterial({
  color: 0x59626f, specular: 0xaab4c4, shininess: 70, side: THREE.DoubleSide
});
const plateOpts = { depth: PLATE_LAYER, curveSegments: 128, bevelEnabled: false };

const baseGeo = new THREE.ExtrudeGeometry(plateShape(true), plateOpts);   // slots cut through the base too
baseGeo.translate(0, 0, -PLATE_LAYER);      // from y = -layer up to y = 0
baseGeo.rotateX(-Math.PI / 2);
const topGeo = new THREE.ExtrudeGeometry(plateShape(true), plateOpts);
topGeo.rotateX(-Math.PI / 2);               // from y = 0 up to y = +layer, slots cut through

const plate = new THREE.Group();
plate.name = 'Plate';
[baseGeo, topGeo].forEach(g => {
  const m = new THREE.Mesh(g, plateMat);
  m.layers.set(1);                          // no bloom, like the lines and copper
  plate.add(m);
});
/* Three hex-head screws on the plate's top face: washer + chamfered hex head + shank.
   Each sits where a slot was left out, 120 degrees apart. */
const HEX_R = 0.2, HEAD_H = 0.16, CHAMFER = 0.025, WASHER_R = 0.23, WASHER_H = 0.03;
const hexShape = new THREE.Shape();
for (let i = 0; i < 6; i++) {
  const t = i * Math.PI / 3, x = HEX_R * Math.cos(t), y = HEX_R * Math.sin(t);
  if (i === 0) hexShape.moveTo(x, y); else hexShape.lineTo(x, y);
}
hexShape.closePath();
const headGeo = new THREE.ExtrudeGeometry(hexShape, {
  depth: HEAD_H - 2 * CHAMFER, curveSegments: 1, bevelEnabled: true,
  bevelThickness: CHAMFER, bevelSize: CHAMFER, bevelOffset: -CHAMFER, bevelSegments: 2
});
headGeo.translate(0, 0, CHAMFER);          // z: 0 .. HEAD_H
headGeo.rotateX(-Math.PI / 2);             // axis = Y
headGeo.translate(0, WASHER_H, 0);         // sits on the washer
const washerGeo = new THREE.CylinderGeometry(WASHER_R, WASHER_R, WASHER_H, 32);
washerGeo.translate(0, WASHER_H / 2, 0);
const shankBottom = -(2 * PLATE_LAYER + 0.15);   // pokes out under the plate
const shankGeo = new THREE.CylinderGeometry(0.07, 0.07, WASHER_H - shankBottom, 16);
shankGeo.translate(0, (WASHER_H + shankBottom) / 2, 0);
const screwMat = new THREE.MeshPhongMaterial({ color: 0x9aa4b2, specular: 0xffffff, shininess: 90 });
/* Thin flat tabs under the plate: each is fixed to its screw's shank and points at the center */
const TAB_LEN = 1.25, TAB_W = 0.26, TAB_T = 0.05, TAB_BACK = 0.1;   // TAB_BACK = bit of tab behind the screw
const tabGeo = new THREE.BoxGeometry(TAB_LEN + TAB_BACK, TAB_T, TAB_W);
tabGeo.translate((TAB_LEN - TAB_BACK) / 2, 0, 0);                    // x = -TAB_BACK .. TAB_LEN
for (let j = 0; j < SCREW_COUNT; j++) {
  const a = (j / SCREW_COUNT) * Math.PI * 2;
  const screw = new THREE.Group();
  screw.name = 'Screw ' + (j + 1);
  [headGeo, washerGeo, shankGeo].forEach(g => {
    const m = new THREE.Mesh(g, screwMat);
    m.layers.set(1);                       // no bloom
    screw.add(m);
  });
  const tab = new THREE.Mesh(tabGeo, screwMat);
  tab.layers.set(1);                       // no bloom
  tab.position.y = -(2 * PLATE_LAYER) - TAB_T / 2;   // flush against the plate's underside
  tab.rotation.y = a + Math.PI;            // local +X now points toward the object's center
  screw.add(tab);
  screw.position.set(SLOT_MID_R * Math.cos(a), PLATE_LAYER, -SLOT_MID_R * Math.sin(a));
  plate.add(screw);
}
/* Two thin concentric rings resting on top of the three tabs (visible through the plate's middle hole).
   Both share the object's center; the tabs are their supports. */
const RING_TUBE = 0.03;
[0.95, 0.6].forEach(r => {
  const g = new THREE.TorusGeometry(r, RING_TUBE, 16, 160);
  g.rotateX(Math.PI / 2);
  const m = new THREE.Mesh(g, screwMat);
  m.position.y = -PLATE_LAYER + RING_TUBE;   // sits right on the tabs' top face
  m.layers.set(1);                           // no bloom
  plate.add(m);
});
ring.add(plate);                            // inside the main object group, spins with the ring

/* One translucent blue-tinted disc directly beneath the ring, touching its inner metallic circle. */
const DISC_T = 0.06;                        // disc thickness
const DISC_GAP = 0.0;                       // disc meets the metallic ring with no vertical gap
const DISC_RADII = [R_IN];                  // one disc, sized to the inner radius of the metallic ring
const GRID_STEP = 0.06015;                  // grid spacing increased by 0.25%
const gridMat = new THREE.LineBasicMaterial({ color: 0x000000, transparent: true, opacity: 0.92 }); // thin black grid lines
/* Crisscross grid clipped to a circle of radius r (horizontal + vertical lines) */
function gridGeometry(r) {
  const p = [], K = Math.floor(r / GRID_STEP);
  for (let k = -K; k <= K; k++) {
    const v = k * GRID_STEP, h = Math.sqrt(Math.max(0, r * r - v * v));
    p.push(v, 0, -h, v, 0, h);              // line running one way
    p.push(-h, 0, v, h, 0, v);              // line running the other way
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(p, 3));
  return g;
}
const discMat = new THREE.MeshPhongMaterial({
  color: 0x5b91d6, specular: 0x9fcaff, shininess: 80,
  transparent: true, opacity: 0.48, depthWrite: false, side: THREE.DoubleSide
});
const discRimMat = new THREE.MeshBasicMaterial({ color: 0x8fc4ff, transparent: true, opacity: 0.55, depthWrite: false });
const discs = new THREE.Group();
discs.name = 'Translucent Discs';
let discTop = -THICK / 2 - DISC_GAP;        // disc top meets the bottom of the ring
DISC_RADII.forEach(r => {
  const d = new THREE.Mesh(new THREE.CylinderGeometry(r, r, DISC_T, 128), discMat);
  d.position.y = discTop - DISC_T / 2;
  d.layers.set(1);                          // no bloom
  discs.add(d);
  const rim = new THREE.Mesh(new THREE.TorusGeometry(r, 0.012, 8, 200), discRimMat);
  rim.rotation.x = Math.PI / 2;
  rim.position.y = discTop;                 // thin bright edge on the top face
  rim.layers.set(1);
  discs.add(rim);
  [discTop + 0.003, discTop - DISC_T - 0.003].forEach(y => {   // grid on the top and bottom faces, whole pattern turned 45 degrees
    const grid = new THREE.LineSegments(gridGeometry(r), gridMat);
    grid.position.y = y;
    grid.rotation.y = Math.PI / 4;
    grid.layers.set(1);
    discs.add(grid);
  });
  discTop -= DISC_T + DISC_GAP;
});
/* Single disc only: no lower disc and no connecting posts. */
ring.add(discs);

/* Bloom */
const composer = new THREE.EffectComposer(renderer);
composer.addPass(new THREE.RenderPass(scene, camera));
const bloom = new THREE.UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.9, 0.7, 0.12);
composer.addPass(bloom);

const pivot = new THREE.Group();           // pivot = drag rotation, ring = auto spin
pivot.add(ring);
pivot.name = 'Ring Object';                // the whole object as one group
scene.add(pivot);

/* Input: drag to rotate, pinch / wheel to zoom, tap to pause */
const el = renderer.domElement;
const pointers = new Map();
let velX = 0, velY = 0, moved = 0, pinchStart = 0, zoomAtPinch = 1, spinning = true;

el.addEventListener('pointerdown', e => {
  el.setPointerCapture(e.pointerId);
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  el.style.cursor = 'grabbing';
  if (pointers.size === 1) moved = 0;
  if (pointers.size === 2) {
    const [a, b] = [...pointers.values()];
    pinchStart = Math.hypot(a.x - b.x, a.y - b.y);
    zoomAtPinch = zoomTarget;
  }
});
el.addEventListener('pointermove', e => {
  const p = pointers.get(e.pointerId);
  if (!p) return;
  const dx = e.clientX - p.x, dy = e.clientY - p.y;
  p.x = e.clientX; p.y = e.clientY;
  if (pointers.size === 1) {
    moved += Math.abs(dx) + Math.abs(dy);
    velY = dx * 0.006; velX = dy * 0.006;
    pivot.rotation.y += velY; pivot.rotation.x += velX;
  } else if (pointers.size === 2) {
    const [a, b] = [...pointers.values()];
    zoomTarget = Math.min(2.2, Math.max(0.5, zoomAtPinch * pinchStart / Math.hypot(a.x - b.x, a.y - b.y)));
    moved = 999;
  }
});
function endPointer(e) {
  const had = pointers.has(e.pointerId);
  pointers.delete(e.pointerId);
  el.style.cursor = 'grab';
  if (had && pointers.size === 0 && moved < 6) spinning = !spinning;
}
el.addEventListener('pointerup', endPointer);
el.addEventListener('pointercancel', endPointer);
el.addEventListener('wheel', e => {
  e.preventDefault();
  zoomTarget = Math.min(2.2, Math.max(0.5, zoomTarget * (1 + e.deltaY * 0.001)));
}, { passive: false });
addEventListener('resize', () => {
  renderer.setSize(innerWidth, innerHeight);
  composer.setSize(innerWidth, innerHeight);
});

/* Animation */
let spinSpeed = 0;
let glowTarget = 1, glowNow = 1, glowNext = 0;
function animate() {
  requestAnimationFrame(animate);

  /* Discrete moving particles only. No continuous luminous plasma surface. */
  const now = performance.now() / 1000;
  particleMat.uniforms.uTime.value = now;

  spinSpeed += ((spinning ? 1 : 0) - spinSpeed) * 0.06;
  ring.rotation.y += 0.004 * spinSpeed;

  if (pointers.size === 0) {
    pivot.rotation.y += velY; pivot.rotation.x += velX;
    velX *= 0.94; velY *= 0.94;
  }
  zoom += (zoomTarget - zoom) * 0.12;
  placeCamera();
  camera.layers.set(0);                    // pass 1: ring only, with bloom
  composer.render();
  camera.layers.set(1);                    // pass 2: ribs + copper on top, no bloom
  renderer.autoClear = false;
  renderer.clearDepth();
  renderer.render(scene, camera);
  renderer.autoClear = true;
}
animate();
</script>
